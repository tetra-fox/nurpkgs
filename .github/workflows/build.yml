name: Build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "51 2 * * 1" # weekly, Monday 02:51 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # uses GH Actions cache for the nix store, so re-runs skip rebuilding unchanged drvs
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build packages
        run: nix-build ci.nix -A buildOutputs

name: Build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "51 2 * * 1" # weekly, Monday 02:51 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build packages
        # cacheOutputs, not buildOutputs: it honors preferLocalBuild, which
        # ableton-wine sets to keep its source wine build off the runner.
        # --arg pkgs pins to flake.lock's nixpkgs instead of NIX_PATH's live
        # nixos-unstable tip, so this matches what `nix build .#x` resolves
        # to and cachix pushed from a local flake build can be substituted
        run: >
          nix-build ci.nix -A cacheOutputs
          --arg pkgs 'import (builtins.getFlake (toString ./.)).inputs.nixpkgs { system = builtins.currentSystem; }'

name: Update flake inputs

on:
  schedule:
    - cron: "0 11 * * *" # every day at 11:00 UTC
  workflow_dispatch:

jobs:
  update-flake-inputs:
    name: Update flake inputs
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write # cache-nix-action needs this to purge old caches

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # shares cache with build.yml (identical primary-key)
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Update flake inputs
        run: nix flake update

      - name: Verify packages still build
        run: nix-build ci.nix -A buildOutputs --no-out-link

      # https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
      - name: Commit changes
        run: |
          if git diff --quiet HEAD -- flake.lock; then
            echo "flake.lock unchanged, skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(flake): bump flake inputs"
          git push

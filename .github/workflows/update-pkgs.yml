name: Update packages

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    name: Update ${{ matrix.package }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write # cache-nix-action needs this to purge old caches

    strategy:
      fail-fast: false
      max-parallel: 1 # serialize so commits don't race on push
      matrix:
        include:
          - package: apple-color-emoji
          - package: surge-dm
          - package: grafana-dashboards
            command: nix run .#update-grafana-dashboards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # shares cache with build.yml (identical primary-key)
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Update package
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.package }}
          CMD: ${{ matrix.command }}
        run: |
          set -euo pipefail
          # custom path emits its own commit_subject/commit_body to $GITHUB_OUTPUT;
          # default path computes the version diff here.
          if [[ -n "$CMD" ]]; then
            eval "$CMD"
          else
            old=$(nix eval --raw ".#$PKG.version" || echo "")
            nix run nixpkgs#nix-update -- --flake --use-update-script "$PKG"
            new=$(nix eval --raw ".#$PKG.version" || echo "")
            if [[ -n "$old" && "$old" != "$new" ]]; then
              echo "commit_subject=$old -> $new" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Verify and commit
        env:
          PKG: ${{ matrix.package }}
          SUBJECT: ${{ steps.update.outputs.commit_subject }}
          BODY: ${{ steps.update.outputs.commit_body }}
        run: |
          set -euo pipefail
          if git diff --quiet HEAD -- "pkgs/$PKG"; then
            echo "no changes"
            exit 0
          fi
          # validate that the bumped metadata still produces a buildable
          # store path before pushing.
          nix-build ci.nix -A buildOutputs --no-out-link
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          subject="${SUBJECT:-updated}"

          git add "pkgs/$PKG"
          if [[ -n "$BODY" ]]; then
            git commit -m "chore($PKG): $subject" -m "$BODY"
          else
            git commit -m "chore($PKG): $subject"
          fi
          git push
